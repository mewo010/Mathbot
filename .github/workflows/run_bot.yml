name: Run Math Bot Daily

on:
  schedule:
    # מוגדר לרוץ כל יום בשעה 06:00 ב-UTC (שזה בערך 08:00 בבוקר שעון ישראל)
    - cron: '0 6 * * *'
  workflow_dispatch: # מאפשר לך ללחוץ ידנית באתר ולבדוק שזה עובד מתי שתרצה

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        run: |
          python math_bot.py

